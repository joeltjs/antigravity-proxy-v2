<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Antigravity Proxy</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: #0b0c10;
    background-image: 
      linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 24px 24px;
    color: #f1f5f9;
    min-height: 100vh;
  }
  .glass-card {
    background: rgba(18, 22, 34, 0.8);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
  }
  .glass-input {
    background: rgba(11, 14, 22, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #f8fafc;
  }
  .glass-input:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    outline: none;
  }
</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

<div class="w-full max-w-md glass-card rounded-2xl p-8">
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-sky-500/10 border border-sky-500/20 mb-4 text-sky-400">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
    </div>
    <h1 class="text-xl font-bold text-white tracking-tight">Antigravity Proxy</h1>
    <p class="text-xs text-slate-400 mt-1">Multi-Account Management Dashboard</p>
  </div>

  <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2 font-mono">Username</label>
      <input type="text" id="username" required autocomplete="username" class="w-full glass-input rounded-xl px-4 py-3 text-sm placeholder:text-slate-500" placeholder="Enter username">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2 font-mono">Password</label>
      <input type="password" id="password" required autocomplete="current-password" class="w-full glass-input rounded-xl px-4 py-3 text-sm placeholder:text-slate-500" placeholder="••••••••••••">
    </div>

    <button type="submit" id="btn-submit" class="w-full py-3.5 px-6 rounded-xl font-bold text-sm bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-slate-950 shadow-lg shadow-sky-500/25 transition-all mt-6">
      Sign In
    </button>
  </form>

  <div class="mt-6 text-center">
  </div>
</div>

<script>
async function handleLogin(e) {
  e.preventDefault();
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const btn = document.getElementById('btn-submit');
  
  if (!u || !p) return;
  
  btn.disabled = true;
  btn.textContent = 'Verifying...';

  try {
    const res = await fetch('/auth/login-web', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });

    const data = await res.json();
    if (res.ok && data.ok) {
      window.location.href = '/';
    } else {
      Swal.fire({
        icon: 'error',
        title: 'Authentication Failed',
        text: data.error?.message || 'Invalid username or password',
        background: '#12141d',
        color: '#f4f4f5',
        confirmButtonColor: '#3b82f6'
      });
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  } catch (err) {
    Swal.fire({
      icon: 'error',
      title: 'Connection Error',
      text: 'Failed to reach server. Please try again.',
      background: '#12141d',
      color: '#f4f4f5',
      confirmButtonColor: '#3b82f6'
    });
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}
</script>
</body>
</html>
